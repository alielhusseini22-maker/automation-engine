name: Content Ideas — Weekly Sunday 9h

on:
  schedule:
    # Every Sunday ~09:23 Paris time (minute 23 to avoid GitHub's top-of-hour load drops)
    - cron: "23 7 * * 0"
  workflow_dispatch:
    inputs:
      project:
        description: "Project ID"
        required: true
        default: "poils-precieux"

jobs:
  ideas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - name: Generate content ideas
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POILS_PRECIEUX_SHOPIFY_TOKEN: ${{ secrets.POILS_PRECIEUX_SHOPIFY_TOKEN }}
          PROJECT: ${{ github.event.inputs.project || 'poils-precieux' }}
        run: node commands/content-ideas.js --project "${{ github.event.inputs.project || 'poils-precieux' }}"

      - name: Upload brief as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-brief-${{ github.run_id }}
          path: runs/poils-precieux/content-ideas/
          retention-days: 90

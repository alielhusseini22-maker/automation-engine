name: Weekly Plan — Sunday 9h (pilote le contenu auto de la semaine)

on:
  schedule:
    # Every Sunday ~09:23 Paris time (minute 23 to avoid GitHub's top-of-hour load drops)
    - cron: "23 7 * * 0"
  workflow_dispatch:
    inputs:
      project:
        description: "Project ID"
        required: true
        default: "poils-precieux"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - name: Generate weekly strategy plan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POILS_PRECIEUX_SHOPIFY_TOKEN: ${{ secrets.POILS_PRECIEUX_SHOPIFY_TOKEN }}
          PROJECT: ${{ github.event.inputs.project || 'poils-precieux' }}
        run: node commands/weekly-plan.js --project "${{ github.event.inputs.project || 'poils-precieux' }}"

      - name: Commit weekly-plan (json lu par pipelines + md lisible)
        run: |
          git config user.name "automation-bot"
          git config user.email "bot@automation-engine.local"
          git add projects/*/weekly-plan.json projects/*/weekly-plan.md
          git commit -m "weekly-plan: $(date +%Y-%m-%d)" || echo "Nothing to commit"
          git push || echo "Nothing to push"

      - name: Upload readable plan as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-plan-${{ github.run_id }}
          path: runs/poils-precieux/weekly-plan/
          retention-days: 90

name: Social — 1 video/day (cycle J1/J2/PAUSE/PAUSE)

on:
  schedule:
    # 14h Paris CEST (12h UTC summer) — 1 seul post/jour. Cycle J1→J2→PAUSE→PAUSE
    # géré par commands/social.js (modulo 4 jours depuis CYCLE_START_ISO).
    - cron: "17 12 * * *"
  workflow_dispatch:
    inputs:
      project:
        description: "Project ID"
        required: true
        default: "poils-precieux"
      day_type:
        description: "Force un type de jour (j1|j2|j3|pause), auto sinon"
        required: false

jobs:
  social:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - name: Install ffmpeg (for TikTok video animation)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Verify ffmpeg
        run: ffmpeg -version | head -1

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run social post generation (cycle J1/J2/J3/PAUSE)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POILS_PRECIEUX_SHOPIFY_TOKEN: ${{ secrets.POILS_PRECIEUX_SHOPIFY_TOKEN }}
          POILS_PRECIEUX_BUFFER_TOKEN: ${{ secrets.POILS_PRECIEUX_BUFFER_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          PROJECT: ${{ github.event.inputs.project || 'poils-precieux' }}
        run: |
          node commands/social.js \
            --project "${{ github.event.inputs.project || 'poils-precieux' }}" \
            ${{ github.event.inputs.day_type && format('--day-type {0}', github.event.inputs.day_type) || '' }}

      - name: Persist anti-duplicate history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add projects/poils-precieux/social-history.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no social-history change to commit"
          else
            git commit -m "chore(social): update anti-duplicate history [skip ci]"
            git pull --rebase --autostash origin master || true
            git push origin HEAD:master || echo "push failed (will retry next run)"
          fi

      - name: Upload preview slides as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-preview-${{ github.run_id }}
          path: runs/poils-precieux/social/
          retention-days: 30
